<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Figi 🐾</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0712;
            --card-bg: #150d22;
            --accent-purple: #9d4edd;
            --accent-glow: #7b2cbf;
            --accent-light: #c77dff;
            --text-main: #f3e8ff;
            --text-muted: #a392b7;
            --border-color: #2a1b40;
            --danger-color: #ff4d6d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding-bottom: 50px;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(123, 44, 191, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(157, 78, 221, 0.15) 0%, transparent 40%);
        }

        header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.6);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .actions-bar {
            max-width: 1200px;
            margin: 0 auto 40px;
            padding: 0 20px;
            display: flex;
            justify-content: center;
        }

        .btn {
            background: var(--card-bg);
            color: var(--accent-light);
            border: 1px solid var(--accent-purple);
            padding: 12px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .gallery-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .card:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 10px 25px rgba(123, 44, 191, 0.3);
            transform: translateY(-5px);
        }

        .card-img-wrapper {
            width: 100%;
            height: 320px;
            overflow: hidden;
            position: relative;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .card-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 2;
        }

        .icon-btn {
            background: rgba(11, 7, 18, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .icon-btn.delete:hover {
            background: var(--danger-color);
            transform: scale(1.1);
        }

        /* Modal / Lightbox */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 2, 9, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 0 30px var(--accent-glow);
            border: 1px solid var(--accent-purple);
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--accent-light);
        }

        /* Modal dodawania zdjęcia */
        .add-modal-content {
            background: var(--card-bg);
            border: 1px solid var(--accent-purple);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .add-modal-content h2 {
            margin-bottom: 20px;
            color: var(--accent-light);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        .submit-btn {
            width: 100%;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>FIGA 🐾</h1>
        <p>Katalog zdjęć przygotowany z miłością</p>
    </header>

    <div class="actions-bar">
        <button class="btn" onclick="openAddModal()">➕ Dodaj link do zdjęcia</button>
    </div>

    <main class="gallery-grid" id="gallery"></main>

    <!-- Modal podglądu -->
    <div class="modal" id="lightbox-modal" onclick="closeLightbox(event)">
        <span class="close-modal" onclick="closeLightbox(event)">&times;</span>
        <img class="modal-content" id="lightbox-img" src="" alt="Powiększenie">
    </div>

    <!-- Modal dodawania -->
    <div class="modal" id="add-modal" onclick="closeAddModal(event)">
        <div class="add-modal-content" onclick="event.stopPropagation()">
            <h2>Dodaj zdjęcie Figi</h2>
            <form id="add-photo-form" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label>Wklej bezpośredni link URL do zdjęcia:</label>
                    <input type="url" id="url-input" placeholder="https://..." required>
                </div>
                <button type="submit" class="btn submit-btn">Dodaj do albumu</button>
            </form>
        </div>
    </div>

    <script>
        // Początkowa lista (możesz tu wpisywać linki do zdjęć Figi)
        let photos = JSON.parse(localStorage.getItem('figa_vercel_gallery')) || [
            { id: 1, src: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600" }
        ];

        function savePhotos() {
            localStorage.setItem('figa_vercel_gallery', JSON.stringify(photos));
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            if (photos.length === 0) {
                gallery.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">Brak zdjęć w galerii. 🐾</p>';
                return;
            }

            photos.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper" onclick="openLightbox('${photo.src}')">
                        <img src="${photo.src}" alt="Zdjęcie Figi" loading="lazy">
                    </div>
                    <div class="card-actions">
                        <button class="icon-btn delete" onclick="deletePhoto(event, ${photo.id})" title="Usuń zdjęcie">
                            🗑️
                        </button>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        function deletePhoto(event, id) {
            event.stopPropagation();
            if (confirm('Usunąć to zdjęcie?')) {
                photos = photos.filter(p => p.id !== id);
                savePhotos();
                renderGallery();
            }
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-modal').classList.add('active');
        }

        function closeLightbox(event) {
            if (event.target.id === 'lightbox-modal' || event.target.className === 'close-modal') {
                document.getElementById('lightbox-modal').classList.remove('active');
            }
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.add('active');
        }

        function closeAddModal(event) {
            if (event.target.id === 'add-modal' || event.type === 'submit') {
                document.getElementById('add-modal').classList.remove('active');
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
